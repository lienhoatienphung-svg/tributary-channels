name: Deploy Staging

# Build and push backend + frontend images tagged "staging" on every push to
# the develop branch, so the staging environment is always up to date with
# the latest pre-release changes. After deployment, smoke tests validate the
# staging environment and trigger automatic rollback on failure.

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io

jobs:
  deploy-staging:
    name: Build & push staging images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deployed_tag: ${{ steps.record_tag.outputs.deployed_tag }}

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            image: stellar-micropay-backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image: stellar-micropay-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # Tag with "staging" and the short commit SHA for traceability.
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_RELEASE=${{ github.sha }}

      - name: Record deployed staging tag
        id: record_tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "deployed_tag=staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Staging smoke tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Run smoke tests
        env:
          STAGING_URL: https://staging.stellarmicropay.io
          SMOKE_TIMEOUT_MS: 15000
          SMOKE_RETRIES: 5
          SMOKE_RETRY_DELAY_MS: 3000
        run: node scripts/smoke-test.js

  rollback-on-failure:
    name: Automatic rollback on failure
    needs: [deploy-staging, smoke-test]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine previous staging image
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DEPLOYED_TAG: ${{ needs.deploy-staging.outputs.deployed_tag }}
        run: |
          set -euo pipefail
          CURRENT_TAG="${DEPLOYED_TAG:-staging-${GITHUB_SHA::7}}"
          echo "Current failed deployment tag: ${CURRENT_TAG}"

          # Resolve ordered staging-<sha> tags from the package version list
          # (org package endpoint with user package fallback) rather than
          # indexing multi-platform manifest entries.
          VERSIONS_JSON=$(gh api "/orgs/${OWNER}/packages/container/stellar-micropay-backend/versions?per_page=50" 2>/dev/null \
            || gh api "/users/${OWNER}/packages/container/stellar-micropay-backend/versions?per_page=50" 2>/dev/null \
            || echo "[]")

          PREV_TAG=$(printf '%s' "${VERSIONS_JSON}" | jq -r --arg cur "${CURRENT_TAG}" '
            [ .[]?
              | (.metadata.container.tags // [])[]
              | select(test("^staging-[0-9a-f]{7,40}$"))
              | select(. != $cur)
            ] | first // empty
          ')

          if [ -z "${PREV_TAG}" ]; then
            echo "::error::Cannot determine a previous staging-<sha> tag (excluding ${CURRENT_TAG}); aborting rollback."
            exit 1
          fi

          echo "Resolved previous staging tag: ${PREV_TAG}"
          echo "deployed_tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Redeploy previous staging tag
        id: rollback
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          STAGING_IMAGE_TAG: ${{ steps.previous.outputs.previous_tag }}
        run: |
          set -euo pipefail
          echo "::warning::Smoke tests failed for ${{ steps.previous.outputs.deployed_tag }}. Redeploying ${STAGING_IMAGE_TAG} via docker-compose.staging.yml."
          for IMAGE in stellar-micropay-backend stellar-micropay-frontend; do
            docker buildx imagetools create \
              -t "${REGISTRY}/${IMAGE_OWNER}/${IMAGE}:staging" \
              "${REGISTRY}/${IMAGE_OWNER}/${IMAGE}:${STAGING_IMAGE_TAG}"
          done
          docker compose -f docker-compose.staging.yml pull frontend backend
          docker compose -f docker-compose.staging.yml up -d --force-recreate

      - name: Notify rollback status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployedTag = '${{ steps.previous.outputs.deployed_tag }}' || `staging-${context.sha.slice(0, 7)}`;
            const previousTag = '${{ steps.previous.outputs.previous_tag }}';
            const previousOutcome = '${{ steps.previous.outcome }}';
            const rollbackOutcome = '${{ steps.rollback.outcome }}';
            const rolledBack = previousOutcome === 'success' && rollbackOutcome === 'success' && Boolean(previousTag);

            const title = rolledBack
              ? `[Rollback] Staging rolled back to ${previousTag} after smoke-test failure (${deployedTag})`
              : `[Rollback Failed] Staging smoke tests failed and automatic rollback did not complete (${deployedTag})`;

            const actionSummary = rolledBack
              ? `Smoke tests failed for \`${deployedTag}\`. Automatic rollback re-tagged \`${previousTag}\` as \`:staging\` and redeployed it with \`docker compose -f docker-compose.staging.yml up -d --force-recreate\`.`
              : `Smoke tests failed for \`${deployedTag}\`, and automatic rollback could not complete (previous-tag lookup: \`${previousOutcome}\`, redeploy step: \`${rollbackOutcome}\`, resolved tag: \`${previousTag || 'none'}\`). Manual intervention is required.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## Staging Smoke-Test Failure & Rollback Report\n\nCommit: ${context.sha}\nDeployed Tag: ${deployedTag}\nPrevious Tag: ${previousTag || 'unresolved'}\nRollback Status: ${rolledBack ? 'Succeeded' : 'Failed'}\nWorkflow: ${context.workflow}\nRun: ${context.runId}\n\n${actionSummary}\n\n### Smoke-Test Checks\n- Health endpoint responsiveness\n- API documentation reachability\n- Security headers presence\n- Network isolation verification`,
              labels: ["incident", "rollback", "staging"]
            });
